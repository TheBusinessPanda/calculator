<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="display">
            0
        </div>
        <div class="buttons">
            <button class="topAction">CE</button>
            <button class="topAction">C</button>
            <button class="topAction">^x</button>
            <button class="actionbtn">&divide;</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="actionbtn">&times;</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="actionbtn">-</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="actionbtn">+</button>
            <button id="zero">0</button>
            <button>.</button>
            <button class="actionbtn">=</button>
        </div>
    </div>
</body>

</html>
