<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="display">
            0
        </div>
        <div class="buttons">
            <button id="clearAll" class="topAction">CE</button>
            <button id="clear" class="topAction">C</button>
            <button id="exponent" class="topAction">^x</button>
            <button id="divide" class="actionbtn">&divide;</button>
            <button id="one">1</button>
            <button id="two">2</button>
            <button id="three">3</button>
            <button id="multiply" class="actionbtn">&times;</button>
            <button id="four">4</button>
            <button id="five">5</button>
            <button id="six">6</button>
            <button id="substract" class="actionbtn">-</button>
            <button id="seven">7</button>
            <button id="eight">8</button>
            <button id="nine">9</button>
            <button id="add" class="actionbtn">+</button>
            <button id="zero">0</button>
            <button id="decimal">.</button>
            <button id="equals" class="actionbtn">=</button>
        </div>
    </div>
</body>

</html>
